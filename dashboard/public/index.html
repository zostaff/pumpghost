<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pumpghost</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--text:#e0e0e0;--dim:#666;
--red:#ff4444;--yellow:#ffaa00;--green:#44ff88;--cyan:#44ccff;--magenta:#cc44ff;--blue:#4488ff}
body{font-family:'SF Mono',Monaco,'Cascadia Code',monospace;background:var(--bg);color:var(--text);min-height:100vh}
.header{padding:24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px}
.header h1{font-size:20px;font-weight:700;letter-spacing:2px}
.header span{color:var(--dim);font-size:13px}
.search{padding:24px;display:flex;gap:12px}
.search input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 16px;font-family:inherit;font-size:14px;border-radius:6px;outline:none}
.search input:focus{border-color:var(--cyan)}
.search button{background:var(--cyan);color:#000;border:none;padding:12px 24px;font-family:inherit;font-weight:700;font-size:14px;border-radius:6px;cursor:pointer}
.search button:hover{opacity:.9}
.search button:disabled{opacity:.4;cursor:not-allowed}
.results{padding:0 24px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.card h2{font-size:14px;color:var(--dim);margin-bottom:12px;letter-spacing:1px}
.score-row{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.score-num{font-size:36px;font-weight:700}
.score-bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.score-fill{height:100%;border-radius:4px;transition:width .5s}
.risk{font-size:13px;font-weight:700;letter-spacing:1px}
.modules{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:700px){.modules{grid-template-columns:1fr}}
.mod{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px}
.mod-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mod-name{font-size:12px;font-weight:700;letter-spacing:1px}
.mod-score{font-size:16px;font-weight:700}
.mod-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:8px}
.mod-fill{height:100%;border-radius:2px}
.mod-details{font-size:11px;color:var(--dim);line-height:1.6}
.recent{margin-top:24px}
.recent-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
.recent-item:hover{color:var(--cyan)}
.loading{text-align:center;padding:40px;color:var(--dim)}
.error{color:var(--red);padding:12px;font-size:13px}
</style>
</head>
<body>
<div class="header">
  <h1>PUMPGHOST</h1>
  <span>pump.fun manipulation detector</span>
</div>
<div class="search">
  <input id="mint" type="text" placeholder="enter token mint address..." spellcheck="false">
  <button id="btn" onclick="scan()">SCAN</button>
</div>
<div class="results" id="results"></div>

<script>
const $ = s => document.querySelector(s);
const mintInput = $('#mint');
const btn = $('#btn');
const results = $('#results');

mintInput.addEventListener('keydown', e => { if (e.key === 'Enter') scan(); });

loadRecent();

async function scan() {
  const mint = mintInput.value.trim();
  if (!mint) return;
  btn.disabled = true;
  btn.textContent = 'SCANNING...';
  results.innerHTML = '<div class="loading">scanning on-chain data...</div>';
  try {
    const res = await fetch('/api/scan?mint=' + encodeURIComponent(mint));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderResult(data);
  } catch (e) {
    results.innerHTML = '<div class="error">Error: ' + esc(e.message) + '</div>';
  }
  btn.disabled = false;
  btn.textContent = 'SCAN';
}

function renderResult(d) {
  const sc = scoreColor(d.organicScore);
  results.innerHTML = `
    <div class="card">
      <h2>ORGANIC SCORE</h2>
      <div class="score-row">
        <div class="score-num" style="color:${sc}">${d.organicScore}</div>
        <div style="flex:1">
          <div class="score-bar"><div class="score-fill" style="width:${d.organicScore}%;background:${sc}"></div></div>
          <div class="risk" style="color:${sc};margin-top:6px">${esc(d.riskLevel)}</div>
        </div>
      </div>
      <div style="color:var(--dim);font-size:12px;margin-top:8px">${esc(d.mint)}</div>
      <div style="color:var(--dim);font-size:11px;margin-top:4px">${d.meta.totalTxs} txs &middot; ${d.meta.totalHolders} holders</div>
      <div class="modules">
        ${modCard('BUMP BOT', d.bump, 'var(--magenta)')}
        ${modCard('MAKER BOT', d.maker, 'var(--cyan)')}
        ${modCard('VOLUME BOT', d.volume, 'var(--yellow)')}
        ${modCard('BUNDLE', d.bundle, 'var(--blue)')}
      </div>
    </div>`;
}

function modCard(name, mod, color) {
  const sc = scoreColor2(mod.score);
  return `<div class="mod">
    <div class="mod-header">
      <span class="mod-name" style="color:${color}">${name}</span>
      <span class="mod-score" style="color:${sc}">${mod.score}</span>
    </div>
    <div class="mod-bar"><div class="mod-fill" style="width:${mod.score}%;background:${sc}"></div></div>
    <div class="mod-details">${mod.details.length ? mod.details.map(esc).join('<br>') : 'no signals detected'}</div>
  </div>`;
}

function scoreColor(s) { return s >= 80 ? 'var(--green)' : s >= 50 ? 'var(--yellow)' : 'var(--red)'; }
function scoreColor2(s) { return s >= 70 ? 'var(--red)' : s >= 40 ? 'var(--yellow)' : 'var(--green)'; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function loadRecent() {
  try {
    const res = await fetch('/api/recent');
    const data = await res.json();
    if (!data.length) return;
    let html = '<div class="card recent"><h2>RECENT SCANS</h2>';
    for (const r of data) {
      const sc = scoreColor(r.organicScore);
      html += `<div class="recent-item" onclick="mintInput.value='${esc(r.mint)}';scan()">
        <span>${r.mint.slice(0,12)}...</span>
        <span style="color:${sc}">${r.organicScore} &mdash; ${esc(r.riskLevel)}</span>
      </div>`;
    }
    html += '</div>';
    results.innerHTML = html;
  } catch {}
}
</script>
</body>
</html>
